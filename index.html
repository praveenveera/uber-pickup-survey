<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup Story — Hyderabad</title>
<meta name="description" content="Praveen Veera's academic research survey about Uber pickup experiences in Hyderabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Hind:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    /* Deliberately a single, fixed light theme — this app is used by an
       older, mixed-literacy audience on unpredictable phones; a
       consistent, high-contrast light surface beats matching device
       dark-mode settings that vary per visitor. An 80s-arcade pixel
       palette: bright paper (not moody neon-dark, for legibility),
       thick ink-black outlines, hot-magenta + cyan retro accents. */
    --ink: #1A1A2E;
    --paper: #FAFAFF;
    --paper-raised: #FFFFFF;
    --line: #1A1A2E;
    --muted: #4A4A68;
    --accent: #FF6B00;
    --accent-ink: #FFFFFF;
    --accent-soft: #FFE2C7;
    --teal: #00B8D4;
    --teal-soft: #D6F7FC;
    --yellow: #FFD400;
    --success: #00C853;
    --danger: #FF3860;
    --radius: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', 'Hind', 'Noto Sans Telugu', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body.lang-hi { font-family: 'Hind', 'Work Sans', sans-serif; }
  body.lang-te { font-family: 'Noto Sans Telugu', 'Work Sans', sans-serif; }
  html { font-size: 112.5%; } /* ~18px base — larger default text throughout */

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .brand { font-family: 'Press Start 2P', cursive; font-size: 0.8rem; letter-spacing: 0.01em; }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-toggle button {
    border: 2.5px solid var(--ink);
    background: var(--paper-raised);
    color: var(--ink);
    border-radius: 0;
    padding: 8px 14px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 44px;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .lang-toggle button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .lang-toggle button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .progress-track {
    height: 4px;
    background: var(--line);
    width: 100%;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 20px 16px 100px;
  }
  .card {
    width: 100%;
    max-width: 460px;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  h1.step-title {
    /* Kept in the readable script fonts, not the pixel display face:
       this text is translated into Telugu/Hindi (which the pixel font
       can't render at all) and is real question content, not chrome —
       forcing it blocky would hurt legibility exactly where it matters
       most. The retro identity comes through shape/color/icons instead. */
    font-size: 1.45rem;
    line-height: 1.35;
    margin: 0 0 8px;
    text-wrap: balance;
    border-bottom: 4px solid var(--accent);
    display: inline-block;
    padding-bottom: 4px;
  }
  .step-hint {
    color: var(--muted);
    font-size: 0.98rem;
    margin: 0 0 20px;
    line-height: 1.55;
  }
  .options { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
  .option-card {
    display: flex; align-items: center; gap: 14px;
    border: 3px solid var(--ink);
    background: var(--paper-raised);
    border-radius: 0;
    padding: 18px 20px;
    cursor: pointer;
    font-size: 1.08rem;
    line-height: 1.45;
    min-height: 44px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.05s ease, box-shadow 0.05s ease, background 0.1s ease;
  }
  .option-card:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .option-card.selected {
    background: var(--accent-soft);
  }
  .option-card .box {
    width: 26px; height: 26px; flex: 0 0 26px;
    border: 3px solid var(--ink);
    border-radius: 0;
    display: flex; align-items: center; justify-content: center;
    color: var(--ink);
    font-size: 16px;
    font-weight: 700;
    background: var(--paper-raised);
  }
  .option-card.selected .box { background: var(--accent); color: #fff; }
  .option-icon { font-size: 1.3rem; line-height: 1; flex: 0 0 auto; }

  textarea, input[type="text"] {
    width: 100%;
    border: 3px solid var(--ink);
    background: var(--paper-raised);
    color: var(--ink);
    border-radius: 0;
    padding: 14px 16px;
    font-size: 1.08rem;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 140px; }
  textarea:focus, input[type="text"]:focus, .option-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field-note { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }

  .textarea-wrap { position: relative; }
  .textarea-wrap textarea { padding-right: 58px; }
  .mic-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 46px; height: 46px;
    border-radius: 0;
    border: 3px solid var(--ink);
    background: var(--teal-soft);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    box-shadow: 3px 3px 0 var(--ink);
  }
  .mic-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 45%, transparent); }
    50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 0%, transparent); }
  }
  .mic-hint { color: var(--muted); font-size: 0.92rem; margin-top: 8px; }
  .error-note { color: var(--danger); font-size: 1rem; font-weight: 600; margin-top: 12px; min-height: 1.2em; }

  .other-field { margin-top: 10px; }

  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 10px;
  }
  .navbar-inner { width: 100%; max-width: 460px; display: flex; gap: 10px; }
  button.nav-btn {
    flex: 1;
    border-radius: 0;
    padding: 17px 22px;
    font-size: 1.12rem;
    font-weight: 700;
    cursor: pointer;
    border: 3px solid var(--ink);
    min-height: 44px;
    box-shadow: 4px 4px 0 var(--ink);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  button.nav-btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--ink); }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-secondary { background: var(--paper-raised); color: var(--ink); flex: 0 0 auto; padding: 17px 22px; }
  button.nav-btn:disabled { opacity: 0.6; cursor: default; }

  .welcome-block { background: var(--teal-soft); border: 3px solid var(--ink); border-radius: 0; padding: 18px; margin-bottom: 20px; font-size: 1.02rem; color: var(--ink); line-height: 1.6; }
  .welcome-badge { display: block; width: fit-content; margin: 0 auto 18px; }

  .pixel-badge {
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--teal-soft);
    border: 3px solid var(--ink);
    box-shadow: 4px 4px 0 var(--ink);
    padding: 14px;
  }

  .thankyou { text-align: center; padding-top: 24px; }
  .thankyou .badge { margin: 0 auto 16px; }
  .thankyou h1 { font-size: 1.6rem; margin-bottom: 10px; }
  .thankyou p { color: var(--ink); font-size: 1.05rem; line-height: 1.55; max-width: 360px; margin-left: auto; margin-right: auto; }

  @keyframes confetti-fall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(70px) rotate(200deg); opacity: 0; }
  }
  .confetti-dot { animation: confetti-fall 1.4s ease-out forwards; }

  .config-warning {
    background: var(--danger);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 16px;
    text-align: center;
  }

  .lang-gate-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 20px;
  }
  .lang-gate-inner { width: 100%; max-width: 460px; margin: 0 auto; }
  .lang-gate-hero { display: block; margin: 0 auto 20px; }
  .lang-gate-brand { font-family: 'Press Start 2P', cursive; font-size: 1.05rem; line-height: 1.7; margin-bottom: 10px; }
  .lang-gate-byline { color: var(--muted); font-size: 0.95rem; margin: 0 0 18px; font-style: italic; }
  .lang-gate-heading { color: var(--muted); font-size: 1.1rem; margin: 0 0 4px; line-height: 1.5; }
  .lang-gate-options { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
  .lang-gate-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    border: 3px solid var(--ink);
    background: var(--paper-raised);
    border-radius: 0;
    padding: 22px 24px;
    cursor: pointer;
    min-height: 44px;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform 0.05s ease, box-shadow 0.05s ease;
  }
  .lang-gate-card:nth-child(1) { border-color: var(--accent); box-shadow: 5px 5px 0 var(--accent); }
  .lang-gate-card:nth-child(2) { border-color: var(--teal); box-shadow: 5px 5px 0 var(--teal); }
  .lang-gate-card:nth-child(3) { border-color: var(--ink); box-shadow: 5px 5px 0 var(--ink); }
  .lang-gate-card:active { transform: translate(4px, 4px); }
  .lang-gate-card:nth-child(1):active { box-shadow: 1px 1px 0 var(--accent); }
  .lang-gate-card:nth-child(2):active { box-shadow: 1px 1px 0 var(--teal); }
  .lang-gate-card:nth-child(3):active { box-shadow: 1px 1px 0 var(--ink); }
  .lang-gate-native { font-size: 1.6rem; font-weight: 700; color: var(--ink); }
  .lang-gate-sub { font-size: 1rem; color: var(--muted); }

  @media (min-width: 480px) {
    h1.step-title { font-size: 1.5rem; }
  }
</style>
</head>

      if (listening) { stopListening(); return; }
      recognition = new SpeechRecognitionCtor();
      recognition.lang = SPEECH_LANG[state.lang] || "en-IN";
      recognition.continuous = true;
      recognition.interimResults = true;
      baseValue = textareaEl.value ? textareaEl.value.replace(/\s+$/, "") + " " : "";
      listening = true;
      micBtn.classList.add("listening");

      recognition.onresult = function (event) {
        var finalChunk = "", interimChunk = "";
        for (var i = event.resultIndex; i < event.results.length; i++) {
          var transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalChunk += transcript;
          else interimChunk += transcript;
        }
        if (finalChunk) baseValue = baseValue + finalChunk + " ";
        textareaEl.value = baseValue + interimChunk;
        state.answers[field] = textareaEl.value;
      };
      recognition.onerror = function (event) {
        stopListening();
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          micBtn.title = t("micDenied");
        }
      };
      recognition.onend = function () { stopListening(); };

      try { recognition.start(); } catch (e) { stopListening(); }
    });

    wrap.appendChild(micBtn);
  }

  function isStorySection(id) {
    return ["whatHappened","location","actions","time","helped","repeat"].indexOf(id) !== -1;
  }

  function visibleSteps() {
    return STEP_ORDER.filter(function (id) {
      if (isStorySection(id) && state.answers.difficulty === "no") return false;
      return true;
    });
  }

  function currentStepId() {
    return visibleSteps()[state.index];
  }

  function isRider() { return state.answers.role === "rider"; }

  // ---- rendering ----

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function svgWrap(markup, className) {
    var wrap = document.createElement("div");
    if (className) wrap.className = className;
    wrap.innerHTML = markup;
    return wrap;
  }

  // ---- hand-built pixel-art icons: a grid of characters, one per "pixel",
  // rendered as crisp-edged <rect> blocks — genuine 8-bit sprites rather
  // than smooth vector illustrations, matching the retro-arcade theme. ----
  function pixelIcon(grid, unit, colors) {
    var rows = grid.length, cols = grid[0].length, rects = "";
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var ch = grid[r].charAt(c);
        if (ch === ".") continue;
        rects += '<rect x="' + (c * unit) + '" y="' + (r * unit) + '" width="' + unit + '" height="' + unit + '" fill="' + (colors[ch] || "#000") + '"/>';
      }
    }
    return '<svg viewBox="0 0 ' + (cols * unit) + ' ' + (rows * unit) + '" width="' + (cols * unit) + '" height="' + (rows * unit) + '" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg" role="presentation">' + rects + "</svg>";
  }

  var CAR_GRID = ["..BBBBBB..", ".BBBBBBBB.", "BBBBBBBBBB", "BBWWBBWWBB", ".K......K.", ".K......K."];
  var PIN_GRID = ["..TTT..", ".TTTTT.", "TTTTTTT", "TTTWWTT", "TTTWWTT", ".TTTTT.", "..TTT..", "...T..."];
  var CHECK_GRID = ["......X", ".....X.", "X...X..", ".X.X...", "..X...."];

  var CAR_ICON = pixelIcon(CAR_GRID, 8, { B: "var(--accent)", W: "var(--paper)", K: "var(--ink)" });
  var PIN_ICON = pixelIcon(PIN_GRID, 8, { T: "var(--teal)", W: "var(--paper-raised)" });
  var PIN_ICON_SMALL = pixelIcon(PIN_GRID, 6, { T: "var(--accent)", W: "var(--paper-raised)" });
  var CHECK_ICON = pixelIcon(CHECK_GRID, 11, { X: "var(--teal)" });

  var HERO_ILLUSTRATION =
    '<div style="display:flex;align-items:center;justify-content:center;gap:12px;">' +
    CAR_ICON +
    '<div style="flex:1;max-width:44px;border-top:4px dashed var(--teal);margin-top:22px;"></div>' +
    PIN_ICON +
    "</div>";

  var WELCOME_BADGE = '<div class="pixel-badge">' + PIN_ICON_SMALL + "</div>";

  var THANKYOU_BADGE =
    '<div style="position:relative;display:inline-block;">' +
    '<div class="pixel-badge">' + CHECK_ICON + "</div>" +
    '<span class="confetti-dot" style="position:absolute;top:-10px;left:-16px;width:10px;height:10px;background:var(--accent);animation-delay:0s;"></span>' +
    '<span class="confetti-dot" style="position:absolute;top:-14px;right:-16px;width:12px;height:12px;background:var(--teal);animation-delay:0.15s;"></span>' +
    '<span class="confetti-dot" style="position:absolute;bottom:-10px;left:-18px;width:8px;height:8px;background:var(--yellow);animation-delay:0.3s;"></span>' +
    '<span class="confetti-dot" style="position:absolute;bottom:-12px;right:-14px;width:10px;height:10px;background:var(--accent);animation-delay:0.2s;"></span>' +
    "</div>";

  var ROLE_ICONS = { rider: "🙋", driver: "🚗" };
  var LOCATION_ICONS = ["✈️", "🛍️", "🏢", "🚉", "🏥", "🏨", "🚦", "🏘️", "📍"];

  function optionCard(kind, selected, label, onClick, icon) {
    var children = [el("span", { class: "box", text: selected ? "✓" : "" })];
    if (icon) children.push(el("span", { class: "option-icon", text: icon }));
    children.push(el("span", { text: label }));
    var card = el("div", {
      class: "option-card " + kind + (selected ? " selected" : ""),
      tabindex: "0",
      role: kind === "radio" ? "radio" : "checkbox",
      "aria-checked": selected ? "true" : "false"
    }, children);
    card.addEventListener("click", onClick);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); }
    });
    return card;
  }

  function renderStep() {
    var card = document.getElementById("card");
    card.innerHTML = "";
    var id = currentStepId();

    if (!id) { renderThankYou(); return; }

    updateProgress();

    var title, hint;

    switch (id) {
      case "welcome": {
        card.appendChild(svgWrap(WELCOME_BADGE, "welcome-badge"));
        card.appendChild(el("div", { class: "eyebrow", text: "1 / " + visibleSteps().length }));
        card.appendChild(el("h1", { class: "step-title", text: t("welcomeTitle") }));
        card.appendChild(el("div", { class: "welcome-block", text: t("welcomeBody") }));
        var box = optionCard("checkbox", state.answers.consent === true, t("consentLabel"), function () {
          state.answers.consent = !state.answers.consent;
          renderStep();
        });
        card.appendChild(el("div", { class: "options" }, [box]));
        break;
      }
      case "role": {
        title = t("roleTitle");
        card.appendChild(stepHeader(title));
        var opts = el("div", { class: "options" }, [
          optionCard("radio", state.answers.role === "rider", t("roleRider"), function () { state.answers.role = "rider"; renderStep(); }, ROLE_ICONS.rider),
          optionCard("radio", state.answers.role === "driver", t("roleDriver"), function () { state.answers.role = "driver"; renderStep(); }, ROLE_ICONS.driver)
        ]);
        card.appendChild(opts);
        break;
      }
      case "city": {
        card.appendChild(stepHeader(t("cityTitle")));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.city === "hyderabad", t("cityHyd"), function () { state.answers.city = "hyderabad"; renderStep(); }),
          optionCard("radio", state.answers.city === "other", t("cityOther"), function () { state.answers.city = "other"; renderStep(); })
        ]));
        if (state.answers.city === "other") {
          var input = el("input", { type: "text", placeholder: t("cityOtherPlaceholder"), class: "other-field" });
          input.value = state.answers.cityOther || "";
          input.addEventListener("input", function (e) { state.answers.cityOther = e.target.value; });
          card.appendChild(input);
        }
        break;
      }
      case "scope": {
        card.appendChild(stepHeader(t("scopeTitle")));
        card.appendChild(yesNoNotSure("scope"));
        break;
      }
      case "difficulty": {
        var dTitle = isRider() ? t("difficultyTitleRider") : t("difficultyTitleDriver");
        card.appendChild(stepHeader(dTitle));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.difficulty === "yes", t("yes"), function () { state.answers.difficulty = "yes"; renderStep(); }),
          optionCard("radio", state.answers.difficulty === "notsure", t("difficultyNotSureLabel"), function () { state.answers.difficulty = "notsure"; renderStep(); }),
          optionCard("radio", state.answers.difficulty === "no", t("no"), function () { state.answers.difficulty = "no"; renderStep(); })
        ]));
        break;
      }
      case "whatHappened": {
        card.appendChild(stepHeader(t("whatHappenedTitle")));
        var whKeys = isRider() ? WHAT_HAPPENED_RIDER : WHAT_HAPPENED_DRIVER;
        var whIds = isRider() ? WHAT_HAPPENED_RIDER_IDS : WHAT_HAPPENED_DRIVER_IDS;
        var whOpts = el("div", { class: "options" });
        if (!state.answers.whatHappened) state.answers.whatHappened = [];
        whKeys.forEach(function (key, i) {
          var wid = whIds[i];
          var selected = state.answers.whatHappened.indexOf(wid) !== -1;
          whOpts.appendChild(optionCard("checkbox", selected, t(key), function () {
            var idx = state.answers.whatHappened.indexOf(wid);
            if (idx === -1) state.answers.whatHappened.push(wid); else state.answers.whatHappened.splice(idx, 1);
            renderStep();
          }));
        });
        card.appendChild(whOpts);
        if (state.answers.whatHappened.indexOf("other") !== -1) {
          var whOtherInput = el("input", { type: "text", placeholder: t("actionsOtherPlaceholder"), class: "other-field" });
          whOtherInput.value = state.answers.whatHappenedOther || "";
          whOtherInput.addEventListener("input", function (e) { state.answers.whatHappenedOther = e.target.value; });
          card.appendChild(whOtherInput);
        }
        break;
      }
      case "location": {
        card.appendChild(stepHeader(t("locationTitle")));
        var locOpts = el("div", { class: "options" });
        if (!state.answers.location) state.answers.location = [];
        LOCATIONS.forEach(function (key, i) {
          var lid = LOCATION_IDS[i];
          var selected = state.answers.location.indexOf(lid) !== -1;
          locOpts.appendChild(optionCard("checkbox", selected, t(key), function () {
            var idx = state.answers.location.indexOf(lid);
            if (idx === -1) state.answers.location.push(lid); else state.answers.location.splice(idx, 1);
            renderStep();
          }, LOCATION_ICONS[i]));
        });
        card.appendChild(locOpts);
        if (state.answers.location.indexOf("other") !== -1) {
          var locOtherInput = el("input", { type: "text", placeholder: t("actionsOtherPlaceholder"), class: "other-field" });
          locOtherInput.value = state.answers.locationOther || "";
          locOtherInput.addEventListener("input", function (e) { state.answers.locationOther = e.target.value; });
          card.appendChild(locOtherInput);
        }
        break;
      }
      case "actions": {
        card.appendChild(stepHeader(t("actionsTitle")));
        var actOpts = el("div", { class: "options" });
        if (!state.answers.actions) state.answers.actions = [];
        ACTIONS.forEach(function (key, i) {
          var aid = ACTION_IDS[i];
          var selected = state.answers.actions.indexOf(aid) !== -1;
          actOpts.appendChild(optionCard("checkbox", selected, t(key), function () {
            var idx = state.answers.actions.indexOf(aid);
            if (idx === -1) state.answers.actions.push(aid); else state.answers.actions.splice(idx, 1);
            renderStep();
          }));
        });
        card.appendChild(actOpts);
        if (state.answers.actions.indexOf("other") !== -1) {
          var otherInput = el("input", { type: "text", placeholder: t("actionsOtherPlaceholder"), class: "other-field" });
          otherInput.value = state.answers.actionsOther || "";
          otherInput.addEventListener("input", function (e) { state.answers.actionsOther = e.target.value; });
          card.appendChild(otherInput);
        }
        break;
      }
      case "time": {
        card.appendChild(stepHeader(t("timeTitle")));
        var timeOpts = el("div", { class: "options" });
        TIME_OPTS.forEach(function (key, i) {
          var tid = TIME_IDS[i];
          timeOpts.appendChild(optionCard("radio", state.answers.timeRange === tid, t(key), function () { state.answers.timeRange = tid; renderStep(); }));
        });
        card.appendChild(timeOpts);
        break;
      }
      case "helped": {
        card.appendChild(stepHeader(t("helpedTitle")));
        var helpKeys = isRider() ? HELPED_RIDER : HELPED_DRIVER;
        var helpIds = isRider() ? HELPED_RIDER_IDS : HELPED_DRIVER_IDS;
        var helpOpts = el("div", { class: "options" });
        if (!state.answers.helped) state.answers.helped = [];
        helpKeys.forEach(function (key, i) {
          var hid = helpIds[i];
          var selected = state.answers.helped.indexOf(hid) !== -1;
          helpOpts.appendChild(optionCard("checkbox", selected, t(key), function () {
            var idx = state.answers.helped.indexOf(hid);
            if (idx === -1) state.answers.helped.push(hid); else state.answers.helped.splice(idx, 1);
            renderStep();
          }));
        });
        card.appendChild(helpOpts);
        if (state.answers.helped.indexOf("other") !== -1) {
          var helpOtherInput = el("input", { type: "text", placeholder: t("actionsOtherPlaceholder"), class: "other-field" });
          helpOtherInput.value = state.answers.helpedOther || "";
          helpOtherInput.addEventListener("input", function (e) { state.answers.helpedOther = e.target.value; });
          card.appendChild(helpOtherInput);
        }
        break;
      }
      case "repeat": {
        card.appendChild(stepHeader(t("repeatTitle")));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.repeat === "yes", t("yes"), function () { state.answers.repeat = "yes"; renderStep(); }),
          optionCard("radio", state.answers.repeat === "no", t("no"), function () { state.answers.repeat = "no"; renderStep(); })
        ]));
        break;
      }
      case "more": {
        card.appendChild(stepHeader(t("moreTitle"), t("moreHint")));
        card.appendChild(textArea("more", t("morePlaceholder")));
        break;
      }
      case "followup": {
        card.appendChild(stepHeader(t("followupTitle")));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.followup === "yes", t("yes"), function () { state.answers.followup = "yes"; renderStep(); }),
          optionCard("radio", state.answers.followup === "no", t("no"), function () { state.answers.followup = "no"; renderStep(); })
        ]));
        if (state.answers.followup === "yes") {
          var contactInput = el("input", { type: "text", placeholder: t("followupContactPlaceholder"), class: "other-field" });
          contactInput.value = state.answers.contact || "";
          contactInput.addEventListener("input", function (e) { state.answers.contact = e.target.value; });
          card.appendChild(contactInput);
        }
        break;
      }
    }

    card.appendChild(el("div", { class: "error-note", id: "errorNote" }));
    updateNavButtons();
  }

  function stepHeader(title, hint) {
    var wrap = document.createDocumentFragment();
    wrap.appendChild(el("div", { class: "eyebrow", text: (state.index + 1) + " / " + visibleSteps().length }));
    wrap.appendChild(el("h1", { class: "step-title", text: title }));
    if (hint) wrap.appendChild(el("p", { class: "step-hint", text: hint }));
    return wrap;
  }

  function yesNoNotSure(field) {
    return el("div", { class: "options" }, [
      optionCard("radio", state.answers[field] === "yes", t("yes"), function () { state.answers[field] = "yes"; renderStep(); }),
      optionCard("radio", state.answers[field] === "no", t("no"), function () { state.answers[field] = "no"; renderStep(); }),
      optionCard("radio", state.answers[field] === "notsure", t("notSure"), function () { state.answers[field] = "notsure"; renderStep(); })
    ]);
  }

  function textArea(field, placeholder) {
    var ta = el("textarea", { placeholder: placeholder });
    ta.value = state.answers[field] || "";
    ta.addEventListener("input", function (e) { state.answers[field] = e.target.value; });

    var wrap = el("div", { class: "textarea-wrap" }, [ta]);
    attachMic(wrap, ta, field);

    var frag = document.createDocumentFragment();
    frag.appendChild(wrap);
    if (SpeechRecognitionCtor) frag.appendChild(el("p", { class: "mic-hint", text: t("micHint") }));
    return frag;
  }

  function renderThankYou() {
    document.getElementById("navbar").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    var card = document.getElementById("card");
    card.innerHTML = "";
    var thankyou = el("div", { class: "thankyou" }, [
      el("h1", { text: t("thankyouTitle") }),
      el("p", { text: t("thankyouBody") })
    ]);
    thankyou.insertBefore(svgWrap(THANKYOU_BADGE, "badge"), thankyou.firstChild);
    card.appendChild(thankyou);
  }

  function updateProgress() {
    var total = visibleSteps().length;
    var pct = Math.round(((state.index + 1) / total) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
  }

  function updateNavButtons() {
    document.getElementById("backBtn").style.visibility = state.index === 0 ? "hidden" : "visible";
    var isLast = state.index === visibleSteps().length - 1;
    var nextBtn = document.getElementById("nextBtn");
    nextBtn.textContent = isLast ? t("submit") : t("next");
    nextBtn.disabled = state.submitting;
  }

  function validateCurrent() {
    var id = currentStepId();
    var a = state.answers;
    switch (id) {
      case "welcome": return a.consent === true;
      case "role": return !!a.role;
      case "city": return !!a.city;
      case "scope": return !!a.scope;
      case "difficulty": return !!a.difficulty;
      case "whatHappened": return a.whatHappened && a.whatHappened.length > 0;
      case "location": return a.location && a.location.length > 0;
      case "actions": return a.actions && a.actions.length > 0;
      case "time": return !!a.timeRange;
      case "helped": return a.helped && a.helped.length > 0;
      case "repeat": return !!a.repeat;
      case "more": return true;
      case "followup": return !!a.followup;
      default: return true;
    }
  }

  function showError() {
    var note = document.getElementById("errorNote");
    if (note) note.textContent = t("required");
  }

  function clearError() {
    var note = document.getElementById("errorNote");
    if (note) note.textContent = "";
  }

  function goNext() {
    if (!validateCurrent()) { showError(); return; }
    clearError();
    var steps = visibleSteps();
    if (state.index === steps.length - 1) {
      submit();
      return;
    }
    state.index += 1;
    renderStep();
    window.scrollTo(0, 0);
  }

  function goBack() {
    if (state.index === 0) return;
    state.index -= 1;
    renderStep();
    window.scrollTo(0, 0);
  }

  function submit() {
    state.submitting = true;
    updateNavButtons();
    document.getElementById("nextBtn").textContent = t("submitting");

    var payload = {
      timestamp: new Date().toISOString(),
      language: state.lang,
      role: state.answers.role || "",
      city: state.answers.city || "",
      cityOther: state.answers.cityOther || "",
      scope4wheeler: state.answers.scope || "",
      difficulty: state.answers.difficulty || "",
      whatHappened: (state.answers.whatHappened || []).join(", "),
      whatHappenedOther: state.answers.whatHappenedOther || "",
      location: (state.answers.location || []).join(", "),
      locationOther: state.answers.locationOther || "",
      actions: (state.answers.actions || []).join(", "),
      actionsOther: state.answers.actionsOther || "",
      timeRange: state.answers.timeRange || "",
      helped: (state.answers.helped || []).join(", "),
      helpedOther: state.answers.helpedOther || "",
      repeatOccurrence: state.answers.repeat || "",
      more: state.answers.more || "",
      followupOk: state.answers.followup || "",
      contact: state.answers.contact || ""
    };

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
      // No backend configured — still show thank-you locally so you can test
      // the flow, but nothing is actually saved. See the red banner.
      state.index += 1;
      renderStep();
      return;
    }

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      state.index += 1;
      renderStep();
    }).catch(function () {
      state.submitting = false;
      var note = document.getElementById("errorNote");
      if (note) note.textContent = t("errorSubmit");
      updateNavButtons();
    });
  }

  function setLang(lang) {
    state.lang = lang;
    document.body.className = "lang-" + lang;
    document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    document.getElementById("brandText").textContent = t("brand");
    renderStep();
  }

  document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
    btn.addEventListener("click", function () { setLang(btn.getAttribute("data-lang")); });
  });
  document.getElementById("nextBtn").addEventListener("click", goNext);
  document.getElementById("backBtn").addEventListener("click", goBack);

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
    document.getElementById("configWarning").hidden = false;
  }

  renderLanguageGate();
})();
</script>
</body>
</html>

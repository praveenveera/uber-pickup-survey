<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pickup Story — Hyderabad</title>
<meta name="description" content="Independent student research survey about Uber pickup experiences in Hyderabad.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&family=Hind:wght@400;500;600;700&family=Noto+Sans+Telugu:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* Deliberately a single, fixed light theme — this app is used by an
       older, mixed-literacy audience on unpredictable phones; a
       consistent, high-contrast light surface beats matching device
       dark-mode settings that vary per visitor. */
    --ink: #1B2130;
    --paper: #F6F5F1;
    --paper-raised: #FFFFFF;
    --line: #C9C5BA;
    --muted: #52565F;
    --accent: #C97A1A;
    --accent-ink: #4A2F0A;
    --success: #3F7A5C;
    --danger: #B4432F;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Work Sans', 'Hind', 'Noto Sans Telugu', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body.lang-hi { font-family: 'Hind', 'Work Sans', sans-serif; }
  body.lang-te { font-family: 'Noto Sans Telugu', 'Work Sans', sans-serif; }
  html { font-size: 112.5%; } /* ~18px base — larger default text throughout */

  .topbar {
    position: sticky; top: 0; z-index: 10;
    background: var(--paper);
    border-bottom: 1px solid var(--line);
    padding: 10px 16px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
  }
  .brand { font-weight: 600; font-size: 0.95rem; letter-spacing: 0.01em; }
  .lang-toggle { display: flex; gap: 8px; }
  .lang-toggle button {
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 0.92rem;
    font-weight: 700;
    cursor: pointer;
    min-width: 44px;
  }
  .lang-toggle button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: var(--accent-ink);
  }

  .progress-track {
    height: 4px;
    background: var(--line);
    width: 100%;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  main {
    flex: 1;
    display: flex;
    justify-content: center;
    padding: 20px 16px 100px;
  }
  .card {
    width: 100%;
    max-width: 460px;
  }
  .eyebrow {
    color: var(--muted);
    font-size: 0.88rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 10px;
  }
  h1.step-title {
    font-size: 1.45rem;
    line-height: 1.35;
    margin: 0 0 8px;
    text-wrap: balance;
  }
  .step-hint {
    color: var(--muted);
    font-size: 0.98rem;
    margin: 0 0 20px;
    line-height: 1.55;
  }
  .options { display: flex; flex-direction: column; gap: 14px; margin-bottom: 8px; }
  .option-card {
    display: flex; align-items: center; gap: 14px;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    border-radius: var(--radius);
    padding: 18px 20px;
    cursor: pointer;
    font-size: 1.08rem;
    line-height: 1.45;
    min-height: 44px;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .option-card:active { transform: scale(0.99); }
  .option-card.selected {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--paper-raised));
  }
  .option-card .box {
    width: 26px; height: 26px; flex: 0 0 26px;
    border: 2px solid var(--muted);
    border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent-ink);
    font-size: 16px;
    font-weight: 700;
    background: var(--paper-raised);
  }
  .option-card.radio .box { border-radius: 999px; }
  .option-card.selected .box { border-color: var(--accent); background: var(--accent); color: #fff; }

  textarea, input[type="text"] {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 1.08rem;
    font-family: inherit;
    resize: vertical;
  }
  textarea { min-height: 140px; }
  textarea:focus, input[type="text"]:focus, .option-card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .field-note { color: var(--muted); font-size: 0.92rem; margin-top: 6px; }

  .textarea-wrap { position: relative; }
  .textarea-wrap textarea { padding-right: 58px; }
  .mic-btn {
    position: absolute;
    right: 10px;
    bottom: 10px;
    width: 46px; height: 46px;
    border-radius: 999px;
    border: 1.5px solid var(--line);
    background: var(--paper-raised);
    color: var(--ink);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    padding: 0;
  }
  .mic-btn.listening {
    background: var(--danger);
    border-color: var(--danger);
    color: #fff;
    animation: mic-pulse 1.1s ease-in-out infinite;
  }
  @keyframes mic-pulse {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 45%, transparent); }
    50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--danger) 0%, transparent); }
  }
  .mic-hint { color: var(--muted); font-size: 0.92rem; margin-top: 8px; }
  .error-note { color: var(--danger); font-size: 1rem; font-weight: 600; margin-top: 12px; min-height: 1.2em; }

  .other-field { margin-top: 10px; }

  .navbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--paper);
    border-top: 1px solid var(--line);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    display: flex; justify-content: center; gap: 10px;
  }
  .navbar-inner { width: 100%; max-width: 460px; display: flex; gap: 10px; }
  button.nav-btn {
    flex: 1;
    border-radius: 999px;
    padding: 17px 22px;
    font-size: 1.12rem;
    font-weight: 700;
    cursor: pointer;
    border: 1.5px solid transparent;
    min-height: 44px;
  }
  .btn-primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .btn-secondary { background: transparent; color: var(--ink); border-color: var(--line); flex: 0 0 auto; padding: 17px 22px; }
  button.nav-btn:disabled { opacity: 0.5; cursor: default; }

  .welcome-block { background: var(--paper-raised); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; margin-bottom: 20px; font-size: 1.02rem; color: var(--ink); line-height: 1.6; }

  .thankyou { text-align: center; padding-top: 40px; }
  .thankyou .icon { font-size: 2.6rem; margin-bottom: 12px; }
  .thankyou h1 { font-size: 1.55rem; margin-bottom: 10px; }
  .thankyou p { color: var(--ink); font-size: 1.05rem; line-height: 1.55; }

  .config-warning {
    background: var(--danger);
    color: #fff;
    font-size: 0.9rem;
    font-weight: 600;
    padding: 10px 16px;
    text-align: center;
  }

  .lang-gate-page {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 32px 20px;
  }
  .lang-gate-inner { width: 100%; max-width: 460px; margin: 0 auto; }
  .lang-gate-brand { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
  .lang-gate-heading { color: var(--muted); font-size: 1.1rem; margin: 0 0 4px; line-height: 1.5; }
  .lang-gate-options { display: flex; flex-direction: column; gap: 16px; margin-top: 28px; }
  .lang-gate-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
    border: 2px solid var(--line);
    background: var(--paper-raised);
    border-radius: var(--radius);
    padding: 22px 24px;
    cursor: pointer;
    min-height: 44px;
  }
  .lang-gate-card:active { transform: scale(0.99); }
  .lang-gate-native { font-size: 1.6rem; font-weight: 700; color: var(--ink); }
  .lang-gate-sub { font-size: 1rem; color: var(--muted); }

  @media (min-width: 480px) {
    h1.step-title { font-size: 1.5rem; }
  }
</style>
</head>

  var LOCATIONS = ["locAirport","locMall","locOffice","locStation","locHospital","locHotel","locStreet","locResidential","locOther"];

  function renderLanguageGate() {
    document.getElementById("chrome").hidden = true;
    document.getElementById("navbar").style.display = "none";
    var card = document.getElementById("card");
    card.innerHTML = "";
    var page = el("div", { class: "lang-gate-page" });
    var inner = el("div", { class: "lang-gate-inner" });
    inner.appendChild(el("div", { class: "lang-gate-brand", text: "Pickup Story · పికప్ కథ · पिकअप कहानी" }));
    inner.appendChild(el("p", { class: "lang-gate-heading", text: "Choose your language" }));
    inner.appendChild(el("p", { class: "lang-gate-heading", text: "మీ భాషను ఎంచుకోండి" }));
    inner.appendChild(el("p", { class: "lang-gate-heading", text: "अपनी भाषा चुनें" }));
    var opts = el("div", { class: "lang-gate-options" });
    LANGUAGE_OPTIONS.forEach(function (opt) {
      var c = el("div", { class: "lang-gate-card", tabindex: "0", role: "button" }, [
        el("span", { class: "lang-gate-native", text: opt.native }),
        el("span", { class: "lang-gate-sub", text: opt.sub })
      ]);
      c.addEventListener("click", function () { chooseLanguage(opt.code); });
      c.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); chooseLanguage(opt.code); }
      });
      opts.appendChild(c);
    });
    inner.appendChild(opts);
    page.appendChild(inner);
    card.appendChild(page);
  }

  function chooseLanguage(code) {
    state.langChosen = true;
    document.getElementById("chrome").hidden = false;
    document.getElementById("navbar").style.display = "";
    setLang(code);
  }

  function t(key) { return I18N[state.lang][key] || key; }

  // ---- voice-to-text (Web Speech API; feature-detected, silently absent
  // on browsers that don't support it, e.g. desktop Firefox, iOS Safari) ----
  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
  var SPEECH_LANG = { en: "en-IN", te: "te-IN", hi: "hi-IN" };

  function attachMic(wrap, textareaEl, field) {
    if (!SpeechRecognitionCtor) return;
    var micBtn = el("button", { type: "button", class: "mic-btn", "aria-label": "Voice input", title: "Voice input" });
    micBtn.textContent = "🎤";
    var recognition = null;
    var listening = false;
    var baseValue = "";

    function stopListening() {
      listening = false;
      micBtn.classList.remove("listening");
      if (recognition) { try { recognition.stop(); } catch (e) {} }
    }

    micBtn.addEventListener("click", function () {
      if (listening) { stopListening(); return; }
      recognition = new SpeechRecognitionCtor();
      recognition.lang = SPEECH_LANG[state.lang] || "en-IN";
      recognition.continuous = true;
      recognition.interimResults = true;
      baseValue = textareaEl.value ? textareaEl.value.replace(/\s+$/, "") + " " : "";
      listening = true;
      micBtn.classList.add("listening");

      recognition.onresult = function (event) {
        var finalChunk = "", interimChunk = "";
        for (var i = event.resultIndex; i < event.results.length; i++) {
          var transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalChunk += transcript;
          else interimChunk += transcript;
        }
        if (finalChunk) baseValue = baseValue + finalChunk + " ";
        textareaEl.value = baseValue + interimChunk;
        state.answers[field] = textareaEl.value;
      };
      recognition.onerror = function (event) {
        stopListening();
        if (event.error === "not-allowed" || event.error === "service-not-allowed") {
          micBtn.title = t("micDenied");
        }
      };
      recognition.onend = function () { stopListening(); };

      try { recognition.start(); } catch (e) { stopListening(); }
    });

    wrap.appendChild(micBtn);
  }

  function isStorySection(id) {
    return ["story","location","cause","actions","time","helped","repeat"].indexOf(id) !== -1;
  }

  function visibleSteps() {
    return STEP_ORDER.filter(function (id) {
      if (isStorySection(id) && state.answers.difficulty === "no") return false;
      return true;
    });
  }

  function currentStepId() {
    return visibleSteps()[state.index];
  }

  function isRider() { return state.answers.role === "rider"; }

  // ---- rendering ----

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) {
      if (k === "class") node.className = attrs[k];
      else if (k === "text") node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) node.appendChild(c); });
    return node;
  }

  function optionCard(kind, selected, label, onClick) {
    var card = el("div", {
      class: "option-card " + kind + (selected ? " selected" : ""),
      tabindex: "0",
      role: kind === "radio" ? "radio" : "checkbox",
      "aria-checked": selected ? "true" : "false"
    }, [
      el("span", { class: "box", text: selected ? "✓" : "" }),
      el("span", { text: label })
    ]);
    card.addEventListener("click", onClick);
    card.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onClick(); }
    });
    return card;
  }

  function renderStep() {
    var card = document.getElementById("card");
    card.innerHTML = "";
    var id = currentStepId();

    if (!id) { renderThankYou(); return; }

    updateProgress();

    var title, hint;

    switch (id) {
      case "welcome": {
        card.appendChild(el("div", { class: "eyebrow", text: "1 / " + visibleSteps().length }));
        card.appendChild(el("h1", { class: "step-title", text: t("welcomeTitle") }));
        card.appendChild(el("div", { class: "welcome-block", text: t("welcomeBody") }));
        var box = optionCard("checkbox", state.answers.consent === true, t("consentLabel"), function () {
          state.answers.consent = !state.answers.consent;
          renderStep();
        });
        card.appendChild(el("div", { class: "options" }, [box]));
        break;
      }
      case "role": {
        title = t("roleTitle");
        card.appendChild(stepHeader(title));
        var opts = el("div", { class: "options" }, [
          optionCard("radio", state.answers.role === "rider", t("roleRider"), function () { state.answers.role = "rider"; renderStep(); }),
          optionCard("radio", state.answers.role === "driver", t("roleDriver"), function () { state.answers.role = "driver"; renderStep(); })
        ]);
        card.appendChild(opts);
        break;
      }
      case "city": {
        card.appendChild(stepHeader(t("cityTitle")));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.city === "hyderabad", t("cityHyd"), function () { state.answers.city = "hyderabad"; renderStep(); }),
          optionCard("radio", state.answers.city === "other", t("cityOther"), function () { state.answers.city = "other"; renderStep(); })
        ]));
        if (state.answers.city === "other") {
          var input = el("input", { type: "text", placeholder: t("cityOtherPlaceholder"), class: "other-field" });
          input.value = state.answers.cityOther || "";
          input.addEventListener("input", function (e) { state.answers.cityOther = e.target.value; });
          card.appendChild(input);
        }
        break;
      }
      case "scope": {
        card.appendChild(stepHeader(t("scopeTitle")));
        card.appendChild(yesNoNotSure("scope"));
        break;
      }
      case "difficulty": {
        var dTitle = isRider() ? t("difficultyTitleRider") : t("difficultyTitleDriver");
        card.appendChild(stepHeader(dTitle));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.difficulty === "yes", t("yes"), function () { state.answers.difficulty = "yes"; renderStep(); }),
          optionCard("radio", state.answers.difficulty === "notsure", t("difficultyNotSureLabel"), function () { state.answers.difficulty = "notsure"; renderStep(); }),
          optionCard("radio", state.answers.difficulty === "no", t("no"), function () { state.answers.difficulty = "no"; renderStep(); })
        ]));
        break;
      }
      case "story": {
        var sTitle = isRider() ? t("storyTitleRider") : t("storyTitleDriver");
        card.appendChild(stepHeader(sTitle));
        card.appendChild(textArea("story", t("storyPlaceholder")));
        break;
      }
      case "location": {
        card.appendChild(stepHeader(t("locationTitle")));
        var locOpts = el("div", { class: "options" });
        LOCATIONS.forEach(function (key, i) {
          var lid = LOCATION_IDS[i];
          locOpts.appendChild(optionCard("radio", state.answers.location === lid, t(key), function () { state.answers.location = lid; renderStep(); }));
        });
        card.appendChild(locOpts);
        break;
      }
      case "cause": {
        card.appendChild(stepHeader(t("causeTitle")));
        card.appendChild(textArea("cause", t("causePlaceholder")));
        break;
      }
      case "actions": {
        card.appendChild(stepHeader(t("actionsTitle")));
        var actOpts = el("div", { class: "options" });
        if (!state.answers.actions) state.answers.actions = [];
        ACTIONS.forEach(function (key, i) {
          var aid = ACTION_IDS[i];
          var selected = state.answers.actions.indexOf(aid) !== -1;
          actOpts.appendChild(optionCard("checkbox", selected, t(key), function () {
            var idx = state.answers.actions.indexOf(aid);
            if (idx === -1) state.answers.actions.push(aid); else state.answers.actions.splice(idx, 1);
            renderStep();
          }));
        });
        card.appendChild(actOpts);
        if (state.answers.actions.indexOf("other") !== -1) {
          var otherInput = el("input", { type: "text", placeholder: t("actionsOtherPlaceholder"), class: "other-field" });
          otherInput.value = state.answers.actionsOther || "";
          otherInput.addEventListener("input", function (e) { state.answers.actionsOther = e.target.value; });
          card.appendChild(otherInput);
        }
        break;
      }
      case "time": {
        card.appendChild(stepHeader(t("timeTitle"), t("timeHint")));
        var timeInput = el("input", { type: "text", inputmode: "numeric", placeholder: t("timePlaceholder") });
        timeInput.value = state.answers.timeLost || "";
        timeInput.addEventListener("input", function (e) { state.answers.timeLost = e.target.value; });
        card.appendChild(timeInput);
        break;
      }
      case "helped": {
        card.appendChild(stepHeader(t("helpedTitle"), t("helpedHint")));
        card.appendChild(textArea("helped", t("helpedPlaceholder")));
        break;
      }
      case "repeat": {
        card.appendChild(stepHeader(t("repeatTitle")));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.repeat === "yes", t("yes"), function () { state.answers.repeat = "yes"; renderStep(); }),
          optionCard("radio", state.answers.repeat === "no", t("no"), function () { state.answers.repeat = "no"; renderStep(); })
        ]));
        break;
      }
      case "more": {
        card.appendChild(stepHeader(t("moreTitle"), t("moreHint")));
        card.appendChild(textArea("more", t("morePlaceholder")));
        break;
      }
      case "followup": {
        card.appendChild(stepHeader(t("followupTitle")));
        card.appendChild(el("div", { class: "options" }, [
          optionCard("radio", state.answers.followup === "yes", t("yes"), function () { state.answers.followup = "yes"; renderStep(); }),
          optionCard("radio", state.answers.followup === "no", t("no"), function () { state.answers.followup = "no"; renderStep(); })
        ]));
        if (state.answers.followup === "yes") {
          var contactInput = el("input", { type: "text", placeholder: t("followupContactPlaceholder"), class: "other-field" });
          contactInput.value = state.answers.contact || "";
          contactInput.addEventListener("input", function (e) { state.answers.contact = e.target.value; });
          card.appendChild(contactInput);
        }
        break;
      }
    }

    card.appendChild(el("div", { class: "error-note", id: "errorNote" }));
    updateNavButtons();

  function stepHeader(title, hint) {
    var wrap = document.createDocumentFragment();
    wrap.appendChild(el("div", { class: "eyebrow", text: (state.index + 1) + " / " + visibleSteps().length }));
    wrap.appendChild(el("h1", { class: "step-title", text: title }));
    if (hint) wrap.appendChild(el("p", { class: "step-hint", text: hint }));
    return wrap;
  }

  function yesNoNotSure(field) {
    return el("div", { class: "options" }, [
      optionCard("radio", state.answers[field] === "yes", t("yes"), function () { state.answers[field] = "yes"; renderStep(); }),
      optionCard("radio", state.answers[field] === "no", t("no"), function () { state.answers[field] = "no"; renderStep(); }),
      optionCard("radio", state.answers[field] === "notsure", t("notSure"), function () { state.answers[field] = "notsure"; renderStep(); })
    ]);
  }

  function textArea(field, placeholder) {
    var ta = el("textarea", { placeholder: placeholder });
    ta.value = state.answers[field] || "";
    ta.addEventListener("input", function (e) { state.answers[field] = e.target.value; });

    var wrap = el("div", { class: "textarea-wrap" }, [ta]);
    attachMic(wrap, ta, field);

    var frag = document.createDocumentFragment();
    frag.appendChild(wrap);
    if (SpeechRecognitionCtor) frag.appendChild(el("p", { class: "mic-hint", text: t("micHint") }));
    return frag;
  }

  function renderThankYou() {
    document.getElementById("navbar").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";
    var card = document.getElementById("card");
    card.innerHTML = "";
    card.appendChild(el("div", { class: "thankyou" }, [
      el("div", { class: "icon", text: "🙏" }),
      el("h1", { text: t("thankyouTitle") }),
      el("p", { text: t("thankyouBody") })
    ]));
  }

  function updateProgress() {
    var total = visibleSteps().length;
    var pct = Math.round(((state.index + 1) / total) * 100);
    document.getElementById("progressFill").style.width = pct + "%";
  }

  function updateNavButtons() {
    document.getElementById("backBtn").style.visibility = state.index === 0 ? "hidden" : "visible";
    var isLast = state.index === visibleSteps().length - 1;
    var nextBtn = document.getElementById("nextBtn");
    nextBtn.textContent = isLast ? t("submit") : t("next");
    nextBtn.disabled = state.submitting;
  }

  function validateCurrent() {
    var id = currentStepId();
    var a = state.answers;
    switch (id) {
      case "welcome": return a.consent === true;
      case "role": return !!a.role;
      case "city": return !!a.city;
      case "scope": return !!a.scope;
      case "difficulty": return !!a.difficulty;
      case "story": return !!(a.story && a.story.trim());
      case "location": return !!a.location;
      case "cause": return !!(a.cause && a.cause.trim());
      case "actions": return a.actions && a.actions.length > 0;
      case "time": return true;
      case "helped": return true;
      case "repeat": return !!a.repeat;
      case "more": return true;
      case "followup": return !!a.followup;
      default: return true;
    }
  }

  function showError() {
    var note = document.getElementById("errorNote");
    if (note) note.textContent = t("required");
  }

  function clearError() {
    var note = document.getElementById("errorNote");
    if (note) note.textContent = "";
  }

  function goNext() {
    if (!validateCurrent()) { showError(); return; }
    clearError();
    var steps = visibleSteps();
    if (state.index === steps.length - 1) {
      submit();
      return;
    }
    state.index += 1;
    renderStep();
    window.scrollTo(0, 0);
  }

  function goBack() {
    if (state.index === 0) return;
    state.index -= 1;
    renderStep();
    window.scrollTo(0, 0);
  }

  function submit() {
    state.submitting = true;
    updateNavButtons();
    document.getElementById("nextBtn").textContent = t("submitting");

    var payload = {
      timestamp: new Date().toISOString(),
      language: state.lang,
      role: state.answers.role || "",
      city: state.answers.city || "",
      cityOther: state.answers.cityOther || "",
      scope4wheeler: state.answers.scope || "",
      difficulty: state.answers.difficulty || "",
      story: state.answers.story || "",
      location: state.answers.location || "",
      cause: state.answers.cause || "",
      actions: (state.answers.actions || []).join(", "),
      actionsOther: state.answers.actionsOther || "",
      timeLostMinutes: state.answers.timeLost || "",
      helped: state.answers.helped || "",
      repeatOccurrence: state.answers.repeat || "",
      more: state.answers.more || "",
      followupOk: state.answers.followup || "",
      contact: state.answers.contact || ""
    };

    if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
      // No backend configured — still show thank-you locally so you can test
      // the flow, but nothing is actually saved. See the red banner.
      state.index += 1;
      renderStep();
      return;
    }

    fetch(APPS_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(payload)
    }).then(function () {
      state.index += 1;
      renderStep();
    }).catch(function () {
      state.submitting = false;
      var note = document.getElementById("errorNote");
      if (note) note.textContent = t("errorSubmit");
      updateNavButtons();
    });
  }

  function setLang(lang) {
    state.lang = lang;
    document.body.className = "lang-" + lang;
    document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
      btn.setAttribute("aria-pressed", btn.getAttribute("data-lang") === lang ? "true" : "false");
    });
    document.getElementById("brandText").textContent = t("brand");
    renderStep();
  }

  document.querySelectorAll(".lang-toggle button").forEach(function (btn) {
    btn.addEventListener("click", function () { setLang(btn.getAttribute("data-lang")); });
  });
  document.getElementById("nextBtn").addEventListener("click", goNext);
  document.getElementById("backBtn").addEventListener("click", goBack);

  if (!APPS_SCRIPT_URL || APPS_SCRIPT_URL.indexOf("PASTE_YOUR") === 0) {
    document.getElementById("configWarning").hidden = false;
  }

  renderLanguageGate();
})();
</script>
</body>
</html>
